version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      xunit:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit.*"
          - "coverlet.*"
      benchmarkdotnet:
        patterns:
          - "BenchmarkDotNet.*" 
      system-packages:
        patterns:
          - "System.*"
    #ignore:
    # - dependency-name: "xunit.runner.visualstudio"
    #   update-types: ["version-update:semver-minor"]
